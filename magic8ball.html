<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/loader.css">
    <script src="/loader.js" defer></script>
</head>

<body>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: powderblue;

        }

        .buttonlink {
            display: inline-block;
            padding: 10px 20px;
            margin: 10px;
            background-color: #4CAF50;
            color: rgb(255, 0, 0);
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
            position: relative;
            z-index: 10;

        }

        .buttonlink:hover {
            background-color: #45a049;

        }

        .ma-blink {
            display: inline-block;
            padding: 10px 20px;
            margin: 10px;
            background-color: #ff1100;
            color: rgb(243, 240, 240);
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
            position: relative;
            z-index: 10;

        }
    </style>

    <h1>Magic 8 Ball</h1>

    <button class="buttonlink" style="border: none;"
        onclick="alert(['Yes', 'No', 'Maybe' , 'Ask Again!', 'Very Doubtful', 'Very Hopeful'][Math.floor(Math.random() * 6)])">Roll</button>
    <script src="/loader.js"></script>
</body>

</html>
